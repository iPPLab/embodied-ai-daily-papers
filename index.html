<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Embodied AI papers, weekly archives, and concise research summaries.">
  <meta name="theme-color" content="#ffffff"><title>Embodied AI Daily Papers</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('embodied-theme')==='dark'?'dark':'light';}catch{}</script>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=20261105-bilingual">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">跳转到论文</a>
  <header class="header">
    <h1 class="brand"><a href="./">Embodied AI Daily Papers</a></h1>
    <nav aria-label="主导航" id="navigation"><a href="./" id="nav-daily" data-i18n="daily">每日论文</a><a href="./?view=popular" id="nav-popular" data-i18n="popular">热门论文</a></nav>
    <div class="preferences">
      <div class="theme-switch" role="group" aria-label="背景颜色" id="theme-switch">
        <button type="button" class="icon-button" id="theme-light" aria-label="白色背景" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
        <button type="button" class="icon-button" id="theme-dark" aria-label="黑色背景" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A9 9 0 0 1 9.5 3.5a9 9 0 1 0 11 11Z"/></svg></button>
      </div>
      <button type="button" id="language-toggle" class="language-button" lang="en" aria-label="Switch to English">EN</button>
      <button type="button" id="toggle-all-summaries" class="icon-button all-summary-toggle" aria-label="展开全部总结" title="展开全部总结" aria-controls="papers" aria-pressed="false" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 7 6 5 6-5M6 13l6 5 6-5"/></svg></button>
    </div>
  </header>
  <main id="main" class="main">
    <section aria-label="论文列表" id="paper-list">
      <div class="list-toolbar"><div class="edition"><h2 id="edition-title"></h2><span id="paper-count" class="muted"></span></div><div id="controls" class="controls"></div></div>
      <p id="status" class="status" role="status">正在加载论文…</p><div id="papers" class="papers"></div>
      <p id="ranking-note" class="ranking-note" hidden></p>
    </section>
  </main>
  <footer class="footer" lang="en">Developer: Bojun Zou, Yuanhao Guo, Weihao Yu</footer>
  <script type="module" src="./app.js?v=20261107-monthly-pdfs"></script>
</body></html>
